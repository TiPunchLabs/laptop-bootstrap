# Smoke-test ansible config — standalone, no dependency on the host's .venv or
# bin/scripts layout. Loaded inside the VM by the ansible_local provisioner
# via Vagrantfile's `a.config_file`.
#
# This file is deliberately minimal: no vault_password_file, no custom
# collections_path. Ansible inside the VM uses its own apt-provided collections.
[defaults]
interpreter_python = /usr/bin/python3
inventory          = /vagrant/inventory.yml
host_key_checking  = False
gathering          = smart
forks              = 4
stdout_callback    = default
any_errors_fatal   = true

[ssh_connection]
pipelining = True
