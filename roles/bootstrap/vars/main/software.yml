---
bootstrap_keyrings_dir: "/etc/apt/keyrings"

bootstrap_software_list:
  - name: "brave"
    package: "brave-browser"
    key_url: "https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg"
    key_format: "gpg"
    deb822:
      uris: "https://brave-browser-apt-release.s3.brave.com"
      suites: "stable"
      components: ["main"]
      architectures: ["{{ bootstrap_apt_arch }}"]

  - name: "typora"
    package: "typora"
    key_url: "https://typora.io/linux/public-key.asc"
    key_format: "ascii"
    deb822:
      uris: "https://typora.io/linux"
      suites: "./"

  - name: "nvidia-container-toolkit"
    package: "nvidia-container-toolkit"
    key_url: "https://nvidia.github.io/libnvidia-container/gpgkey"
    key_format: "ascii"
    deb822:
      uris: "https://nvidia.github.io/libnvidia-container/stable/deb"
      suites: "/"
      append_arch_to_uri: true

  - name: "dbeaver-ce"
    package: "dbeaver-ce"
    key_url: "https://dbeaver.io/debs/dbeaver.gpg.key"
    key_format: "ascii"
    key_id: "132C13A8A330F403"
    deb822:
      uris: "https://dbeaver.io/debs/dbeaver-ce"
      suites: "/"
      architectures: ["{{ bootstrap_apt_arch }}"]

  - name: "vscode"
    package: "code"
    key_url: "https://packages.microsoft.com/keys/microsoft.asc"
    key_format: "ascii"
    deb822:
      uris: "https://packages.microsoft.com/repos/code"
      suites: "stable"
      components: ["main"]
      architectures: ["{{ bootstrap_apt_arch }}"]

  # Pinning architectures silences the i386 warning emitted by APT when the
  # upstream `.deb` postinst writes a source without an Architectures field.
  - name: "google-chrome"
    package: "google-chrome-stable"
    key_url: "https://dl.google.com/linux/linux_signing_key.pub"
    key_format: "ascii"
    deb822:
      uris: "https://dl.google.com/linux/chrome/deb"
      suites: "stable"
      components: ["main"]
      architectures: ["{{ bootstrap_apt_arch }}"]

  - name: "trivy"
    package: "trivy"
    key_url: "https://aquasecurity.github.io/trivy-repo/deb/public.key"
    key_format: "ascii"
    deb822:
      uris: "https://aquasecurity.github.io/trivy-repo/deb"
      suites: "generic"
      components: ["main"]
      architectures: ["{{ bootstrap_apt_arch }}"]
