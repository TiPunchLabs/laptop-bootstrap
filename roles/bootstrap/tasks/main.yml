---
- name: Check if the host is a Debian or an Ubuntu
  ansible.builtin.set_fact:
    bootstrap_is_debian_like: "{{ ansible_facts['os_family'] == 'Debian' }}"

- name: Verify if the host is a Debian or an Ubuntu
  ansible.builtin.assert:
    that:
      - bootstrap_is_debian_like
    msg: "This role is only supported on Debian familiy systems."

- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ bootstrap_desired_hostname }}"
  when: ansible_facts['hostname'] != bootstrap_desired_hostname

- name: Get the username running the deploy
  become: false
  ansible.builtin.command: whoami
  register: bootstrap_username_on_the_host
  delegate_to: localhost
  changed_when: false
  tags: always

- name: Set fact username on the host
  ansible.builtin.set_fact:
    bootstrap_local_user: "{{ bootstrap_username_on_the_host.stdout }}"
  tags: always

- name: Update and upgrade package list
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
    cache_valid_time: 3600  # Skip apt update if cache is less than 1 hour old
  tags:
    - update

- name: Install a list of packages
  ansible.builtin.apt:
    pkg: "{{ bootstrap_packages }}"

- name: Update file hosts
  ansible.builtin.include_tasks:
    file: update_hosts.yml

- name: Install package from deb
  ansible.builtin.include_tasks:
    file: install_from_deb.yml
  loop: "{{ bootstrap_deb_packages }}"
  loop_control:
    loop_var: deb_package

- name: Detect dpkg architecture (e.g., amd64, arm64)
  ansible.builtin.command: dpkg --print-architecture
  register: bootstrap_dpkg_arch
  changed_when: false

- name: Save apt_arch fact
  ansible.builtin.set_fact:
    bootstrap_apt_arch: "{{ bootstrap_dpkg_arch.stdout | trim }}"

- name: Install software
  ansible.builtin.include_tasks:
    file: install_software.yml
  loop: "{{ bootstrap_software_list }}"
  loop_control:
    loop_var: software

- name: Install vagrant + libvirt
  ansible.builtin.include_role:
    name: vagrant
  tags:
    - vagrant

- name: Install And Configure Git
  ansible.builtin.include_role:
    name: git
  tags:
    - git

- name: Install Docker
  ansible.builtin.include_role:
    name: docker
  tags:
    - docker

- name: Install devtools
  ansible.builtin.include_role:
    name: devtools
  tags:
    - devtools

- name: Cleanup legacy installations before mise takes over
  ansible.builtin.include_role:
    name: cleanup_legacy
    apply:
      tags:
        - cleanup-legacy
        - cli-tools
  tags:
    - cleanup-legacy
    - cli-tools

- name: Install CLI tools via mise
  ansible.builtin.include_role:
    name: cli_tools
    apply:
      tags:
        - cli-tools
        - mise
  tags:
    - cli-tools
    - mise

