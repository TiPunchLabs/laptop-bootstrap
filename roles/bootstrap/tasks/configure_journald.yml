---
- name: Ensure /etc/systemd/journald.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy journald drop-in (recommended laptop defaults)
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/00-laptop-defaults.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart systemd-journald
