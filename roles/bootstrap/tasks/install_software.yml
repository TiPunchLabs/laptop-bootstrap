---
# ——— Key paths ———
- name: Define key path
  ansible.builtin.set_fact:
    bootstrap_key_gpg_path: "{{ bootstrap_keyrings_dir }}/{{ software.name }}.gpg"

# ——— Key handling ———
# Delegated to apt_keyring so a vendor key rotation heals on the next run
# instead of leaving apt stuck on NO_PUBKEY — see roles/apt_keyring/README.md.
- name: Install the vendor signing key
  ansible.builtin.include_role:
    name: apt_keyring
  vars:
    apt_keyring_name: "{{ software.name }}"
    apt_keyring_path: "{{ bootstrap_key_gpg_path }}"
    apt_keyring_url: "{{ software.key_url }}"
    apt_keyring_format: "{{ software.key_format | lower }}"
    apt_keyring_key_id: "{{ software.key_id | default('') }}"

# ——— Deb822 source ———
- name: Remove legacy .list (if any) to avoid conflicts
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ software.name }}.list"
    state: absent

# deb822_repository writes /etc/apt/sources.list.d/{{ name }}.sources with
# the canonical format expected by apt. `append_arch_to_uri` (used by
# nvidia-container-toolkit) is rendered into the URI here so the module
# keeps seeing the same value across runs.
- name: Configure apt source (deb822)
  ansible.builtin.deb822_repository:
    name: "{{ software.name }}"
    types: deb
    uris: >-
      {{ (software.deb822.uris | trim).rstrip('/') }}{% if software.deb822.append_arch_to_uri | default(false) %}/{{ bootstrap_apt_arch }}{% endif %}/
    suites: "{{ software.deb822.suites }}"
    components: "{{ software.deb822.components | default(omit) }}"
    architectures: "{{ software.deb822.architectures | default(omit) }}"
    signed_by: "{{ bootstrap_key_gpg_path }}"
    state: present
  notify: Update apt cache
