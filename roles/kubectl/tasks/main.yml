---
- name: Check if the key file exists for Kubernetes
  ansible.builtin.stat:
    path: "{{ kubectl_kubernetes_gpg.path }}"
  register: key_exists

- name: Download Kubernetes official GPG key
  ansible.builtin.get_url:
    url: "{{ kubectl_kubernetes_gpg.url }}"
    dest: "{{ kubectl_kubernetes_gpg.tmp_path }}"
    mode: '0644'
  when: kubectl_kubernetes_gpg.url is defined and not key_exists.stat.exists

- name: Add GPG key for Kubernetes
  ansible.builtin.command: >
    gpg --dearmor -o {{ kubectl_kubernetes_gpg.path }} {{ kubectl_kubernetes_gpg.tmp_path }}
  args:
    creates: "{{ kubectl_kubernetes_gpg.path }}"
  when: kubectl_kubernetes_gpg.url is defined and not key_exists.stat.exists

- name: Set up the Kubernetes repository
  ansible.builtin.apt_repository:
    repo: "{{ kubectl_kubernetes_gpg.repo }}"
    filename: "kubernetes"
    state: present
    update_cache: true

- name: Install kubectl
  ansible.builtin.apt:
    name: kubectl
    state: present

- name: Get system architecture
  ansible.builtin.command: uname -m
  register: system_arch
  changed_when: false

- name: Set architecture for download
  ansible.builtin.set_fact:
    kubectl_arch: "{{ 'amd64' if system_arch.stdout == 'x86_64' else 'arm64' }}"

- name: Download kubectl-convert
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v{{ kubectl_version }}.0/bin/linux/{{ kubectl_arch }}/kubectl-convert"
    dest: /usr/local/bin/kubectl-convert
    mode: '0755'
  register: kubectl_convert_download
  failed_when: false

- name: Verify kubectl-convert installation
  ansible.builtin.command: kubectl-convert --help
  register: kubectl_convert_check
  changed_when: false
  failed_when: false
