---
- name: Validate Open WebUI settings
  ansible.builtin.assert:
    that:
      - open_webui_version is match('^v\d+\.\d+\.\d+$')
      - open_webui_bind_address is match('^(\d{1,3}\.){3}\d{1,3}$')
      - open_webui_host_port | int > 0
      - open_webui_host_port | int < 65536
      - open_webui_allowed_sources is sequence and open_webui_allowed_sources is not string
      - open_webui_allowed_sources | reject('match', '^(\d{1,3}\.){3}\d{1,3}(/\d{1,2})?$') | list | length == 0
      - not (open_webui_lan_exposed | bool) or open_webui_allowed_sources | length > 0
      - open_webui_url == '' or open_webui_url is match('^https?://')
    fail_msg: >-
      open_webui_version must be a release tag such as v0.13.0 (not main, latest
      or dev); open_webui_bind_address must be an IPv4 address and
      open_webui_host_port a port; open_webui_allowed_sources must be a list of
      IPv4 addresses or CIDRs, not empty when the bind address is not loopback;
      open_webui_url must be "" or an http(s) URL.
    quiet: true

# community.docker talks to the Docker API through python3-requests.
- name: Install the Python library used by community.docker
  ansible.builtin.apt:
    name: python3-requests
    state: present

- name: Create the Open WebUI data volume
  community.docker.docker_volume:
    name: "{{ open_webui_volume_name }}"
    state: present

# Before the container: the filter must be in place when the port leaves loopback.
- name: Filter LAN access to the published port
  ansible.builtin.import_tasks: firewall.yml
  when: open_webui_lan_exposed | bool

# A version bump changes the image, so the container is recreated with the same
# volume. pull: missing never refreshes a tag that is already present.
# state: healthy starts the container, then waits for its health check, so a
# broken start fails the run instead of reporting green.
- name: Run the Open WebUI container and wait until it is healthy
  community.docker.docker_container:
    name: "{{ open_webui_container_name }}"
    image: "{{ open_webui_image }}:{{ open_webui_version }}"
    pull: missing
    state: healthy
    healthy_wait_timeout: "{{ open_webui_health_timeout }}"
    restart_policy: unless-stopped
    container_default_behavior: no_defaults
    published_ports:
      - "{{ open_webui_bind_address }}:{{ open_webui_host_port }}:8080"
    mounts:
      - type: volume
        source: "{{ open_webui_volume_name }}"
        target: /app/backend/data
    etc_hosts:
      host.docker.internal: host-gateway
    # WEBUI_SECRET_KEY_FILE: start.sh generates the key on first start; keeping the
    # file in the volume preserves sessions and encrypted settings across recreation.
    env: >-
      {{ {'OLLAMA_BASE_URL': open_webui_ollama_base_url,
          'WEBUI_SECRET_KEY_FILE': '/app/backend/data/.webui_secret_key'}
         | combine({'WEBUI_URL': open_webui_url} if open_webui_url | length > 0 else {}) }}
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health | jq -ne 'input.status == true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s

# After the container: the port is back on loopback before the filter goes away.
- name: Remove the LAN filter when the port is on loopback
  ansible.builtin.import_tasks: firewall_absent.yml
  when: not open_webui_lan_exposed | bool
