---
# Internal; not meant to be overridden. The LAN filter itself (chain
# OPEN-WEBUI-INGRESS, open-webui-firewall.service, /usr/local/sbin/open-webui-firewall)
# is installed by the docker_port_filter role, imported from tasks/main.yml.
open_webui_lan_exposed: "{{ open_webui_bind_address is not match('^127\\.') }}"
