---
- name: Get latest Starship version from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/starship/starship/releases/latest
    return_content: true
    headers:
      Accept: application/vnd.github.v3+json
  register: starship_latest_release
  changed_when: false
  failed_when: false

- name: Set latest version fact
  ansible.builtin.set_fact:
    starship_latest_version: "{{ (starship_latest_release.content | from_json).tag_name | regex_replace('^v', '') }}"
  when: starship_latest_release.status == 200

- name: Set fallback version if API failed
  ansible.builtin.set_fact:
    starship_latest_version: "999.999.999"
  when: starship_latest_release.status != 200

- name: Check if Starship is installed
  ansible.builtin.command: starship --version
  register: starship_current
  changed_when: false
  failed_when: false

- name: Set current version fact
  ansible.builtin.set_fact:
    starship_current_version: "{{ starship_current.stdout | regex_search('starship ([0-9.]+)', '\\1') | first | default('0.0.0') }}"
  when: starship_current.rc == 0

- name: Set current version to 0.0.0 if not installed
  ansible.builtin.set_fact:
    starship_current_version: "0.0.0"
  when: starship_current.rc != 0

- name: Display version information
  ansible.builtin.debug:
    msg: "Starship: installed={{ starship_current_version }}, latest={{ starship_latest_version }}"

- name: Download Starship install script
  ansible.builtin.get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship_install.sh
    mode: '0755'
  when: starship_current_version is version(starship_latest_version, '<')

- name: Install/Update Starship
  ansible.builtin.shell:
    cmd: /tmp/starship_install.sh --yes
    executable: /bin/sh
  when: starship_current_version is version(starship_latest_version, '<')
  register: starship_install_result

- name: Clean up Starship install script
  ansible.builtin.file:
    path: /tmp/starship_install.sh
    state: absent

- name: Ensure Starship init line is in .bashrc
  ansible.builtin.lineinfile:
    path: "/home/{{ starship_local_user }}/.bashrc"
    line: 'eval "$(starship init bash)"'
    create: true
    state: present
    mode: '0644'
  become_user: "{{ starship_local_user }}"
