---
- name: Set fact username on the host
  ansible.builtin.set_fact:
    starship_local_user: "{{ username_on_the_host.stdout }}"

- name: Apply the changes to .bashrc
  ansible.builtin.shell: source /home/{{ starship_local_user }}/.bashrc
  args:
    executable: /bin/bash
  become_user: "{{ starship_local_user }}"
  when: starship_local_user != 'root'
