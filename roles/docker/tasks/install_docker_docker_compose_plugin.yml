---
- name: Install necessary packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present

- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent

# Delegated to apt_keyring so a Docker key rotation heals on the next run
# instead of leaving apt stuck on NO_PUBKEY — see roles/apt_keyring/README.md.
- name: Install the Docker signing key
  ansible.builtin.include_role:
    name: apt_keyring
    apply:
      tags:
        - docker
  vars:
    apt_keyring_name: docker
    apt_keyring_path: "{{ docker_gpg.path }}"
    apt_keyring_url: "{{ docker_gpg.url }}"
    apt_keyring_format: ascii

- name: Configure Docker apt source (deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_deb822.uris }}"
    suites: "{{ docker_deb822.suites }}"
    components: "{{ docker_deb822.components }}"
    architectures: "{{ docker_deb822.architectures }}"
    signed_by: "{{ docker_gpg.path }}"
    state: present
  notify: Update apt cache

- name: Refresh apt cache now so the install step sees the new source
  ansible.builtin.meta: flush_handlers

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-compose-plugin
    state: present

- name: Start and enable Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
