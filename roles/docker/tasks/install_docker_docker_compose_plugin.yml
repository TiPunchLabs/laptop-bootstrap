---
- name: Install necessary packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present

- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Check if the key file exists for Docker
  ansible.builtin.stat:
    path: "{{ docker_gpg.path }}"
  register: docker_key_exists

- name: Download Docker official GPG key (ASCII)
  ansible.builtin.get_url:
    url: "{{ docker_gpg.url }}"
    dest: "{{ docker_gpg.path }}.asc"
    mode: '0644'
  when: docker_gpg.url is defined and not docker_key_exists.stat.exists

# Dearmor to a staging file then rename into place — see the same
# pattern in roles/bootstrap/tasks/install_software.yml for the
# motivation (partial-write recovery).
- name: Dearmor Docker key to staging file (.new)
  ansible.builtin.command:
    cmd: "gpg --batch --yes --dearmor -o {{ docker_gpg.path }}.new {{ docker_gpg.path }}.asc"
  args:
    creates: "{{ docker_gpg.path }}"
  register: docker_dearmor
  when: docker_gpg.url is defined and not docker_key_exists.stat.exists

- name: Atomically move dearmored Docker key into place  # noqa: no-handler
  ansible.builtin.copy:
    src: "{{ docker_gpg.path }}.new"
    dest: "{{ docker_gpg.path }}"
    remote_src: true
    mode: '0644'
  when: docker_dearmor is changed

- name: Cleanup Docker dearmor staging and .asc files  # noqa: no-handler
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ docker_gpg.path }}.new"
    - "{{ docker_gpg.path }}.asc"
  when: docker_dearmor is changed

- name: Remove legacy docker.list (if any) to avoid conflicts
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Configure Docker apt source (deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_deb822.uris }}"
    suites: "{{ docker_deb822.suites }}"
    components: "{{ docker_deb822.components }}"
    architectures: "{{ docker_deb822.architectures }}"
    signed_by: "{{ docker_gpg.path }}"
    state: present
  notify: Update apt cache

- name: Refresh apt cache now so the install step sees the new source
  ansible.builtin.meta: flush_handlers

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-compose-plugin
    state: present

- name: Start and enable Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
