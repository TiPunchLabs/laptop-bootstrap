---
- name: Create resolved.conf.d directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy split DNS configuration
  ansible.builtin.template:
    src: split-dns.conf.j2
    dest: "/etc/systemd/resolved.conf.d/{{ item.name }}-dns.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ dns_split_domains }}"
  notify: Restart systemd-resolved

- name: Remove stale NetworkManager dispatcher script
  ansible.builtin.file:
    path: /etc/NetworkManager/dispatcher.d/10-internal-dns
    state: absent
