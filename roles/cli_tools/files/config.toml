# Reference mise config for a fresh laptop.
# Ansible (roles/cli_tools) copies it to ~/.config/mise/config.toml only when
# that file is absent; afterwards mise owns the live config. Promote a
# validated live config back here by hand — see README → Managing CLI tools.

[tools]
# Exact pins: a fresh laptop gets the versions validated on the owner's laptop;
# kubectl follows the clusters in use (1.34, within the ±1 minor skew policy).
# `mise upgrade` never moves them; change one with `mise use -g <tool>@<version>`.
uv = "0.13.5"
fzf = "0.74.5"
direnv = "2.38.2"
zoxide = "0.10.0"
eza = "0.23.5"
bat = "0.26.1"
chezmoi = "2.73.3"
starship = "1.27.0"
kubectl = "1.34.13"
terraform = "1.17.0"
awscli = "2.38.5"
k9s = "0.51.0"
# Major-pinned: "latest" would follow the moving Current line. Bump with
# `mise use -g node@<major>`, then promote here once validated.
node = "26"
pnpm = "12"
