---
# mise install script (single bootstrap entry point)
cli_tools_mise_install_url: https://mise.run

# Path to the mise binary once installed (per-user)
cli_tools_mise_bin: "/home/{{ bootstrap_local_user }}/.local/bin/mise"

# Path to the global mise config
cli_tools_mise_config_dir: "/home/{{ bootstrap_local_user }}/.config/mise"
cli_tools_mise_config_file: "{{ cli_tools_mise_config_dir }}/config.toml"

# Tools declared in mise config.toml. Use "latest" unless a pinned version is needed.
cli_tools_mise_tools:
  uv: latest
  fzf: latest
  direnv: latest
  zoxide: latest
  eza: latest
  bat: latest
  chezmoi: latest
  starship: latest
  kubectl: latest
  terraform: latest
  awscli: latest

# Shell hooks managed as an ordered, atomic block in ~/.bashrc. mise must come
# first so starship/direnv/fzf can resolve mise-managed binaries on PATH.
# `fzf --bash` (fzf >=0.48) emits key-bindings + completion inline — replaces
# the old `source /usr/share/doc/fzf/examples/...` lines that only existed
# under the apt package.
#
# Pre-load git's completion BEFORE `fzf --bash`: fzf snapshots `complete -p git`
# at init time, so if `__git_main` isn't already registered fzf clobbers git's
# completion with its generic path completer (no subcommands/branches/refs).
# The bash-completion framework itself is left to Ubuntu's default bashrc — git's
# completion is self-contained for the path that runs at fzf-init time.
cli_tools_bashrc_block: |
  eval "$(~/.local/bin/mise activate bash)"
  if ! shopt -oq posix; then
    [ -r /usr/share/bash-completion/completions/git ] && . /usr/share/bash-completion/completions/git
  fi
  eval "$(fzf --bash)"
  eval "$(starship init bash)"
  eval "$(direnv hook bash)"
