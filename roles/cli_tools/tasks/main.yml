---
- name: Install mise via upstream script  # noqa: command-instead-of-module
  ansible.builtin.shell:
    cmd: "set -o pipefail && curl -fsSL {{ cli_tools_mise_install_url }} | sh"
    executable: /bin/bash
    creates: "{{ cli_tools_mise_bin }}"
  environment:
    HOME: "/home/{{ bootstrap_local_user }}"
  become: true
  become_user: "{{ bootstrap_local_user }}"

- name: Ensure mise config directory exists
  ansible.builtin.file:
    path: "{{ cli_tools_mise_config_dir }}"
    state: directory
    owner: "{{ bootstrap_local_user }}"
    group: "{{ bootstrap_local_user }}"
    mode: '0755'

# Seed only: once the global config exists, mise owns it (`mise use -g`,
# `mise upgrade --bump`, ...) and Ansible never rewrites it. The reference in
# files/config.toml is the source for a fresh laptop, promoted by hand.
- name: Seed mise global config from the reference
  ansible.builtin.copy:
    src: config.toml
    dest: "{{ cli_tools_mise_config_file }}"
    owner: "{{ bootstrap_local_user }}"
    group: "{{ bootstrap_local_user }}"
    mode: '0644'
    force: false
  register: cli_tools_mise_config

# First bootstrap only. On an existing laptop, installing or removing tools
# is done with mise directly — no Ansible-side prune. Not a handler: a later
# failure would skip it, and the next run would see the seeded config and
# never install.
- name: Install tools from the freshly seeded config  # noqa: no-handler
  ansible.builtin.command:
    cmd: "{{ cli_tools_mise_bin }} install --yes"
  environment:
    HOME: "/home/{{ bootstrap_local_user }}"
  become: true
  become_user: "{{ bootstrap_local_user }}"
  when: cli_tools_mise_config.changed
  changed_when: true

- name: Install managed shell-hooks block in .bashrc
  ansible.builtin.blockinfile:
    path: "/home/{{ bootstrap_local_user }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED: cli_tools shell hooks"
    # insertbefore uses first-match; insertafter picks the LAST match, which
    # on a populated bashrc lands after every function-local `esac`, at EOF.
    # Anchor on HISTCONTROL (Ubuntu default, just after the interactive-shell
    # guard) so the block runs before any other tool hooks. Missing anchor
    # falls back to EOF — still correct in isolation.
    insertbefore: '^HISTCONTROL='
    block: "{{ cli_tools_bashrc_block }}"
    create: true
    mode: '0644'
  become: true
  become_user: "{{ bootstrap_local_user }}"

# The PNPM_HOME block written by pnpm's standalone installer prepends to PATH
# after `mise activate` ran, and mise keeps entries added after activation
# ahead of its own — the standalone pnpm then shadows mise's. Append instead:
# PNPM_HOME stays on PATH for the global bins, mise's pnpm wins. No-op when
# the installer block is absent.
- name: Move PNPM_HOME behind mise-managed binaries in .bashrc
  ansible.builtin.replace:
    path: "/home/{{ bootstrap_local_user }}/.bashrc"
    regexp: '^(\s*\*\) export PATH=)"\$PNPM_HOME:\$PATH"(\s*;;)$'
    replace: '\1"$PATH:$PNPM_HOME"\2'
  become: true
  become_user: "{{ bootstrap_local_user }}"
