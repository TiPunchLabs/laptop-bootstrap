---
# Tools superseded by mise — see ADR-0001. Purge is idempotent; safe on clean systems.
cleanup_legacy_apt_packages:
  - fzf
  - bat
  - direnv
  - eza
  - kubectl
  - terraform

# HashiCorp sources/keyring stay — still used by the vagrant role.
# Chrome/Trivy `.list` files are auto-removed by install_software.yml when the
# matching deb822 source is configured, so they don't need to appear here.
cleanup_legacy_apt_sources:
  - /etc/apt/sources.list.d/kubernetes.list

# Old keyrings under /usr/share/keyrings are no longer referenced once the
# bootstrap role rewrites the corresponding `.sources` to point at
# /etc/apt/keyrings/<name>.gpg.
cleanup_legacy_apt_keyrings:
  - /usr/share/keyrings/kubernetes-apt-keyring.gpg
  - /usr/share/keyrings/google-chrome.gpg
  - /usr/share/keyrings/trivy.gpg

cleanup_legacy_paths:
  - /usr/local/bin/starship
  - /usr/local/bin/aws
  - /usr/local/bin/aws_completer
  - /usr/local/bin/kubectl-convert
  - /usr/local/aws-cli

cleanup_legacy_user_paths:
  - "/home/{{ bootstrap_local_user }}/.local/bin/uv"

# Orphan bashrc lines left by pre-mise installs. MUST NOT overlap with
# cli_tools_bashrc_block content (e.g., do NOT list `eval "$(starship init bash)"`
# here) — lineinfile: state=absent would then strip the block's lines every run
# and produce false "changed" events forever.
cleanup_legacy_bashrc_lines:
  - 'complete -C /usr/bin/terraform terraform'
  - 'source /usr/share/doc/fzf/examples/key-bindings.bash'
  - 'source /usr/share/doc/fzf/examples/completion.bash'
