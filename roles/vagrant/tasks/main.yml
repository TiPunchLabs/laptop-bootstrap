---
- name: Ensure apt-transport-https is installed
  ansible.builtin.apt:
    name: apt-transport-https
    state: present

# Delegated to apt_keyring so a HashiCorp key rotation heals on the next run
# instead of leaving apt stuck on NO_PUBKEY — see roles/apt_keyring/README.md.
- name: Install the HashiCorp signing key
  ansible.builtin.include_role:
    name: apt_keyring
    apply:
      tags:
        - vagrant
  vars:
    apt_keyring_name: hashicorp
    apt_keyring_path: "{{ vagrant_hashicorp_gpg.key_path }}"
    apt_keyring_url: "{{ vagrant_hashicorp_gpg.key_url }}"
    apt_keyring_format: ascii

- name: Configure HashiCorp apt source (deb822)
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: "{{ vagrant_hashicorp_deb822.uris }}"
    suites: "{{ vagrant_hashicorp_deb822.suites }}"
    components: "{{ vagrant_hashicorp_deb822.components }}"
    signed_by: "{{ vagrant_hashicorp_gpg.key_path }}"
    state: present
  notify: Update apt cache

- name: Refresh apt cache now so the install step sees the new source
  ansible.builtin.meta: flush_handlers

- name: Install vagrant and libvirt dependencies
  ansible.builtin.apt:
    pkg: "{{ vagrant_packages + vagrant_libvirt_dependencies }}"
    state: present

- name: Check if vagrant-libvirt plugin is installed
  ansible.builtin.command: vagrant plugin list
  register: vagrant_plugin_list
  changed_when: false
  become: true
  become_user: "{{ bootstrap_local_user }}"

- name: Install the vagrant-libvirt plugin
  ansible.builtin.command:
    cmd: vagrant plugin install vagrant-libvirt
  become: true
  become_user: "{{ bootstrap_local_user }}"
  when: "'vagrant-libvirt' not in vagrant_plugin_list.stdout"
  changed_when: true
