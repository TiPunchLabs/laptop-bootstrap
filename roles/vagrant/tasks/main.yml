---
- name: Ensure apt-transport-https is installed
  ansible.builtin.apt:
    name: apt-transport-https
    state: present

- name: Install HashiCorp GPG key
  ansible.builtin.shell:
    cmd: "set -o pipefail && curl -fsSL {{ vagrant_hashicorp_gpg.key_url }} | gpg --dearmor -o {{ vagrant_hashicorp_gpg.key_path }}"
    executable: /bin/bash
    creates: "{{ vagrant_hashicorp_gpg.key_path }}"

- name: Add HashiCorp apt repository
  ansible.builtin.apt_repository:
    repo: "{{ vagrant_hashicorp_gpg.repo }}"
    filename: hashicorp
    state: present

- name: Install vagrant and libvirt dependencies
  ansible.builtin.apt:
    pkg: "{{ vagrant_packages + vagrant_libvirt_dependencies }}"
    state: present

- name: Check if vagrant-libvirt plugin is installed
  ansible.builtin.command: vagrant plugin list
  register: vagrant_plugin_list
  changed_when: false
  become_user: "{{ bootstrap_local_user }}"

- name: Install the vagrant-libvirt plugin
  ansible.builtin.command:
    cmd: vagrant plugin install vagrant-libvirt
  become_user: "{{ bootstrap_local_user }}"
  when: "'vagrant-libvirt' not in vagrant_plugin_list.stdout"
  changed_when: true

- name: Ensure the current user is in the libvirt group
  ansible.builtin.user:
    name: "{{ bootstrap_local_user }}"
    groups: libvirt
    append: true

- name: Enable and start the libvirtd service
  ansible.builtin.service:
    name: libvirtd
    enabled: true
    state: started
