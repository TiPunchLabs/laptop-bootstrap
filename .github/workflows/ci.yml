---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Create dummy vault password for CI
        run: |
          echo 'ci-dummy-vault-password' > /tmp/vault-pass.txt
          echo "ANSIBLE_VAULT_PASSWORD_FILE=/tmp/vault-pass.txt" >> "$GITHUB_ENV"

      - name: Run yamllint
        run: uv run yamllint .

      - name: Run ansible-lint
        run: uv run ansible-lint

      - name: Syntax check
        run: uv run ansible-playbook playbook.yml --syntax-check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.11'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate (terraform/)
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
