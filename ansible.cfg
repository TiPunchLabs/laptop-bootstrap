[defaults]
interpreter_python = /usr/bin/python3
# Empty on purpose: collections come only from the running Python's sys.path,
# i.e. the uv-managed .venv (whatever its Python version), never from
# ~/.ansible/collections or /usr/share/ansible/collections.
collections_path =
inventory = inventory.yml
host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp
forks = 25
# dans une exécution local cette directive est ignoré
# remote_user = ansible
vault_password_file = ./bin/ansible-vault-pass.sh
callbacks_enabled    = profile_tasks, timer

[ssh_connection]
pipelining=True
ssh_args = -o ControlMaster=auto -o ControlPersist=3600s -o PreferredAuthentications=publickey
